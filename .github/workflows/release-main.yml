# Build and create a draft GitHub Release on every push to main/master.
# Tag format: v{package.json version}. Publish the draft in GitHub when ready.
# Drafts are not the "latest" release until published.
#
# When the version is a prerelease (contains a "-", e.g. 1.4.20-rc.1), this
# workflow additionally publishes (not draft) a second, moving-tag release
# under the fixed tag "prerelease". That release is overwritten on every
# prerelease build, giving testers one static, always-current manifest URL:
#   https://github.com/<owner>/<repo>/releases/download/prerelease/system.json
# Stable (non-prerelease) versions only get the versioned draft, unchanged.

name: Release (main / master)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine prerelease status
        id: prerelease
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify manifest and package versions stay in sync
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SYS_VERSION=$(node -p "require('./src/system.json').version")
          if [ "$PKG_VERSION" != "$SYS_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION, src/system.json=$SYS_VERSION"
            exit 1
          fi

      - name: Build
        env:
          CI: true
        run: npm run build

      - name: Package manifest and zip
        env:
          SYSTEM_VERSION: v${{ steps.pkg.outputs.version }}
        run: |
          cp dist/system.json system.json
          mv dist "fvtt-cyberpunk-red-core-${SYSTEM_VERSION}"
          zip -qr "fvtt-cyberpunk-red-core-${SYSTEM_VERSION}.zip" "fvtt-cyberpunk-red-core-${SYSTEM_VERSION}"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          body: |
            **Draft** — publish this release on GitHub when you are ready for it to go live.

            Built from commit [`${{ github.event.workflow_run.head_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}) on branch `${{ github.event.workflow_run.head_branch }}`.

            **Artifacts**
            - `system.json` — manifest (same as inside the zip)
            - `fvtt-cyberpunk-red-core-v${{ steps.pkg.outputs.version }}.zip` — installable system folder for Foundry VTT

            After you **publish** this release, the manifest URL for Foundry can use:
            `https://github.com/${{ github.repository }}/releases/latest/download/system.json`

            ${{ steps.prerelease.outputs.is_prerelease == 'true' && format('**This is a prerelease build.** A static, always-current manifest URL for prerelease/RC builds is published automatically (no need to publish this draft for testers to get it):\n`https://github.com/{0}/releases/download/prerelease/system.json`', github.repository) || '' }}
          files: |
            system.json
            fvtt-cyberpunk-red-core-v${{ steps.pkg.outputs.version }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite manifest download URL for the static prerelease alias
        if: steps.prerelease.outputs.is_prerelease == 'true'
        run: |
          ZIP_NAME="fvtt-cyberpunk-red-core-v${{ steps.pkg.outputs.version }}.zip"
          jq --arg url "https://github.com/${{ github.repository }}/releases/download/prerelease/${ZIP_NAME}" \
             '.download = $url' system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Remove previous static "prerelease" alias release
        if: steps.prerelease.outputs.is_prerelease == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete prerelease --cleanup-tag --yes || true

      - name: Publish static "prerelease" alias release
        if: steps.prerelease.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          tag_name: prerelease
          name: "Prerelease (always the latest RC/beta build)"
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            **Always-current pre-release build.** This tag/release is overwritten by every prerelease version pushed to `main` (versions containing a `-`, e.g. `-rc.1`, `-beta.1`). It is not a fixed version.

            Currently: `v${{ steps.pkg.outputs.version }}`, built from commit [`${{ github.event.workflow_run.head_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}) on branch `${{ github.event.workflow_run.head_branch }}`.

            **Static manifest URL** for Foundry's "Install System" → Manifest URL field:
            `https://github.com/${{ github.repository }}/releases/download/prerelease/system.json`

            For a fixed, stable release instead, install a specific tagged version or use the `releases/latest` manifest URL.
          files: |
            system.json
            fvtt-cyberpunk-red-core-v${{ steps.pkg.outputs.version }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
